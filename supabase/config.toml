# Local Supabase for Charioteer. Run `supabase start` from the repo root.
project_id = "charioteer"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://127.0.0.1:43127"
additional_redirect_urls = ["http://127.0.0.1:43127", "http://127.0.0.1:43127/set-password", "http://localhost:43127", "http://localhost:43127/set-password", "charioteer://", "charioteer://set-password"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.external.apple]
enabled = false
client_id = ""
secret = ""
redirect_uri = ""

[realtime]
enabled = true

[functions.thumos-chat]
verify_jwt = true

[functions.thumos-voice-token]
verify_jwt = true

[functions.thumos-voice-turn]
verify_jwt = true

[functions.account-export]
verify_jwt = true

[functions.account-delete]
verify_jwt = true

[functions.progress-photo-url]
verify_jwt = true
